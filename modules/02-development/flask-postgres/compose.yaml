services:
  web:
    build: .
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      DB_HOST: db
      POSTGRES_USER: ${POSTGRES_USER:-guide}
      POSTGRES_DB: ${POSTGRES_DB:-guide}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-guide}
      POSTGRES_DB: ${POSTGRES_DB:-guide}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres_data:/var/lib/postgresql/data
  adminer:
    image: adminer:4.8.1
    profiles: [tools]
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
