apiVersion: v1
kind: Service
metadata:
  name: flask
  namespace: python-guide
spec:
  selector:
    app: flask
  ports:
    - port: 5000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask
  namespace: python-guide
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flask
  template:
    metadata:
      labels:
        app: flask
    spec:
      containers:
        - name: flask
          image: python-guide-flask:local
          imagePullPolicy: Never
          env:
            - name: DB_HOST
              value: db
            - name: POSTGRES_USER
              value: guide
            - name: POSTGRES_DB
              value: guide
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-auth
                  key: password
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            periodSeconds: 5
          startupProbe:
            httpGet:
              path: /health
              port: 5000
            failureThreshold: 30
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
