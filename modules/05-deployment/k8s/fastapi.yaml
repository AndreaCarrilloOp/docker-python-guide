apiVersion: v1
kind: Service
metadata:
  name: fastapi
  namespace: python-guide
spec:
  selector:
    app: fastapi
  ports:
    - port: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi
  namespace: python-guide
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fastapi
  template:
    metadata:
      labels:
        app: fastapi
    spec:
      containers:
        - name: fastapi
          image: python-guide-fastapi:local
          imagePullPolicy: Never
          env:
            - name: REDIS_URL
              value: redis://redis:6379/0
            - name: ENVIRONMENT
              value: production
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            failureThreshold: 30
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
